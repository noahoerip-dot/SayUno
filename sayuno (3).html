<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sayuno – Learn languages</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6ff;--card:#fff;--ink:#141b3a;--mute:#66719a;--line:#dce2f4;--g:#2b50e0;--gd:#1c37a8;--gl:#e4eaff;--b:#2b50e0;--bd:#1c37a8;--bl:#e4eaff;--ok:#17a673;--okd:#0f7a55;--okl:#d9f4e8;--r:#ff5a5f;--rd:#d63a40;--rl:#ffe0e1;--y:#ffc800;--yd:#d9a800;--lock:#e3e5e8;--lockd:#c4c8cd;
--dots:radial-gradient(color-mix(in srgb,var(--g) 18%,transparent) 1.4px,transparent 1.8px);--out:cubic-bezier(.22,1,.36,1);--io:cubic-bezier(.45,0,.55,1);--spring:cubic-bezier(.34,1.3,.64,1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1030;--card:#131c47;--ink:#eef1ff;--mute:#93a0d0;--line:#27336b;--g:#5878f2;--gd:#2f4cc4;--gl:#1b2a6b;--b:#7f98ff;--bl:#1b2a6b;--ok:#2fd195;--okd:#5ee3b0;--okl:#0f3a2d;--rd:#ff8a8e;--rl:#47202c;--lock:#27336b;--lockd:#18214d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1030;--card:#131c47;--ink:#eef1ff;--mute:#93a0d0;--line:#27336b;--g:#5878f2;--gd:#2f4cc4;--gl:#1b2a6b;--b:#7f98ff;--bl:#1b2a6b;--ok:#2fd195;--okd:#5ee3b0;--okl:#0f3a2d;--rd:#ff8a8e;--rl:#47202c;--lock:#27336b;--lockd:#18214d;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);background-image:var(--dots);background-size:26px 26px;color:var(--ink);font:700 16px/1.45 "Outfit",system-ui,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:5;padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:30px;color:var(--g);letter-spacing:-1.2px}.logo::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--y);margin-left:3px}
#stats{display:flex;gap:8px;font-weight:800}#stats span{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 12px}
#langs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}
.chip{flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:800}
.chip.on{border-color:var(--g);background:var(--g);color:#fff}
.banner{position:relative;overflow:hidden;background:var(--g);color:#fff;border-radius:26px;box-shadow:0 14px 28px -12px rgba(43,80,224,.6);padding:22px 22px 24px;margin:6px 0 16px}.banner::after{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);box-shadow:0 0 0 16px rgba(255,255,255,.08)}
.banner h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px}.banner p{margin:2px 0 0;opacity:.92;font-weight:600}
#path{position:relative;display:flex;flex-direction:column;align-items:center;gap:30px;padding:10px 0}#path::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--line)}
.step{display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
.bub{position:absolute;top:-34px;background:var(--y);color:#3a2c00;border-radius:99px;padding:3px 14px;font-weight:800}
.node{width:84px;height:84px;border-radius:28px;border:0;font-size:32px;color:#fff;background:var(--g);box-shadow:inset 0 -6px 0 rgba(0,0,0,.16),0 12px 22px -8px color-mix(in srgb,var(--g) 65%,transparent)}
.node:active{transform:scale(.95)}
.node.done{background:var(--y);color:#3a2c00;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 12px 22px -8px rgba(217,168,0,.6)}
.node.lock{background:var(--lock);box-shadow:inset 0 -6px 0 rgba(0,0,0,.08);cursor:not-allowed}
.step span{margin-top:14px;font-weight:800;padding:0 8px;text-shadow:0 0 8px var(--bg),0 0 8px var(--bg),0 0 12px var(--bg)}.step small{color:var(--mute);font-weight:500;padding:0 8px;text-shadow:0 0 8px var(--bg),0 0 8px var(--bg),0 0 12px var(--bg)}
.foot{text-align:center;color:var(--mute);font-weight:600;margin-top:28px}
.tabs{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto;padding:2px}
#book h3{margin:22px 0 4px;font-size:18px;color:var(--g)}
.ph{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;border-bottom:2px solid var(--line);padding:12px 2px}
.ph b{display:block;font-size:20px}.ph small{display:block;color:var(--mute);font-weight:600}
/* lesson */
#lesson{position:fixed;inset:0;background:var(--bg);background-image:var(--dots);background-size:26px 26px;z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lt{max-width:520px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 16px}
.x{background:none;border:0;font-size:22px;color:var(--mute)}
.track{flex:1;height:16px;background:var(--lock);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--g);border-radius:99px;transition:width .7s var(--out)}
#q{flex:1;overflow:auto;max-width:520px;width:100%;margin:0 auto;padding:10px 16px}
#q h2{font-size:24px;font-weight:900;margin:8px 0 18px}
.word{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.word b{display:block;font-size:30px}.word small{color:var(--mute);font-weight:600;font-size:16px}
.spk{width:56px;height:56px;border-radius:50%;background:var(--g);border:0;color:#fff;box-shadow:0 8px 16px -6px rgba(43,80,224,.6);font-size:24px}
.opts{display:grid;gap:12px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;font-size:18px;font-weight:700}
.opt small{display:block;color:var(--mute);font-weight:600;font-size:14px}
.opt.sel{border-color:var(--b);background:var(--bl);box-shadow:0 0 0 3px var(--b)}
.opt.ok{border-color:var(--ok);background:var(--okl);box-shadow:0 0 0 3px var(--ok)}.opt.bad{border-color:var(--r);background:var(--rl);box-shadow:0 0 0 3px var(--r)}
#foot{padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line)}
#foot>*{max-width:520px;margin-left:auto;margin-right:auto}
#foot.ok{background:var(--okl);border-color:var(--okl)}#foot.bad{background:var(--rl);border-color:var(--rl)}
#fb{min-height:0;margin-bottom:12px;font-size:18px;font-weight:800}#foot.ok #fb{color:var(--okd)}#foot.bad #fb{color:var(--rd)}
#fb:empty{display:none}
.big{display:block;width:100%;background:var(--g);color:#fff;border:0;border-radius:99px;box-shadow:0 12px 22px -10px rgba(43,80,224,.75);padding:16px;font-size:17px;font-weight:800}
.big:active{transform:scale(.98)}
.big:disabled{background:var(--lock);color:var(--mute);box-shadow:none;cursor:not-allowed}
#foot.bad .big{background:var(--r);box-shadow:0 12px 22px -10px rgba(255,90,95,.7)}
.end{text-align:center;padding-top:8vh}.end .em{font-size:84px}.end h2{font-size:30px}
.end .row{display:flex;gap:12px;justify-content:center;margin-top:18px}
.pill{border:2px solid var(--y);color:var(--yd);border-radius:14px;padding:10px 18px;font-size:20px}
.node{position:relative}
.node:not(.done):not(.lock)::after{content:"";position:absolute;inset:0;border-radius:28px;border:3px solid var(--g);animation:ring 2.4s var(--out) infinite;pointer-events:none}
.bub{animation:bob 2s var(--io) infinite}
.banner{animation:up .7s var(--out) backwards}
.in .node{animation:pop .75s var(--spring) backwards;animation-delay:var(--d)}
.in span,.in small{animation:up .6s var(--out) backwards;animation-delay:var(--d)}
.node.stamp{animation:stamp .8s var(--spring) .15s backwards}
#bkw{animation:up .5s var(--out) backwards}
#lesson{animation:syLs .45s ease both}
#q>h2,.word{animation:up .5s var(--out) backwards}
.opt{animation:up .55s var(--out) backwards}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt.ok{animation:bump .5s var(--io)}.opt.bad{animation:shake .5s var(--io)}
#foot{transition:background .4s var(--io),border-color .4s var(--io)}
#foot.ok #fb,#foot.bad #fb{animation:up .4s var(--out) backwards}

.end .em{animation:pop .8s var(--spring) backwards}
.end h2,.end .row{animation:up .6s var(--out) .75s backwards}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:30;pointer-events:none;animation:fall var(--t) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.55);opacity:0}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes bump{40%{transform:scale(1.04)}}

@keyframes stamp{from{transform:scale(2.2) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.node::after{display:none}}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg .w{position:absolute;font-style:normal;font-weight:800;color:var(--b);opacity:.1;white-space:nowrap;animation:drift var(--s) var(--io) var(--dl) infinite alternate}
#bg::before,#bg::after{content:"";position:absolute;border-radius:50%;border:2px solid color-mix(in srgb,var(--g) 16%,transparent)}
#bg::before{width:380px;height:380px;right:-130px;top:-110px;box-shadow:0 0 0 44px color-mix(in srgb,var(--g) 6%,transparent),0 0 0 92px color-mix(in srgb,var(--g) 3.5%,transparent)}
#bg::after{width:300px;height:300px;left:-120px;bottom:-100px;box-shadow:0 0 0 40px color-mix(in srgb,var(--g) 6%,transparent),0 0 0 84px color-mix(in srgb,var(--g) 3.5%,transparent)}
@keyframes drift{from{transform:translate(0,0) rotate(var(--r))}to{transform:translate(var(--dx),-28px) rotate(calc(var(--r) * -1))}}
.chip,.node,.big,.opt,.ph,.spk,.banner{transition:transform .4s var(--spring),box-shadow .35s var(--out),filter .3s var(--out),background .3s var(--out),color .3s var(--out),border-color .3s var(--out),padding .3s var(--out)}
.node.sm{width:62px;height:62px;border-radius:50%;font-size:24px}
.node.rev{background:var(--card);color:var(--g);box-shadow:inset 0 0 0 3px var(--g),0 10px 18px -8px color-mix(in srgb,var(--g) 45%,transparent)}
.node.rev::after{display:none}
.step.rv span{font-size:14px;font-weight:700;color:var(--mute);margin-top:8px}

.gear{width:40px;height:40px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);font-size:18px;transition:transform .5s var(--spring)}
@media (hover:hover){.gear:hover{transform:rotate(60deg)}}.gear:active{transform:scale(.9)}
.prac{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--y);color:var(--ink);border-radius:20px;padding:14px 18px;margin-bottom:22px;font-weight:800;animation:up .5s var(--out) backwards;transition:transform .3s var(--spring)}.prac:active{transform:scale(.97)}
#sq{width:100%;padding:12px 18px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;margin-bottom:6px}#sq:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.spk.sl{order:2;width:44px;height:44px;font-size:18px;background:var(--bl);color:var(--g);box-shadow:none}.word>div{order:3}
#set{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,16,48,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .3s var(--out)}
#sheet{width:100%;max-width:520px;background:var(--card);border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .45s var(--out)}
#sheet h3{margin:0 0 4px;font-size:22px}#sheet p{margin:16px 0 8px;color:var(--mute)}.rw{display:flex;gap:8px;flex-wrap:wrap}
.reset{margin-top:22px;width:100%;background:none;border:1.5px solid var(--r);color:var(--r);border-radius:99px;padding:12px;font-weight:800}
@keyframes fade{from{opacity:0}}
#bt{overflow:hidden;padding-bottom:4px;margin-bottom:-4px}#bt span{display:block}
#home.out #path,#home.out #pr,#home.out #bkw{animation:swout .26s var(--io) forwards}
#home.out #bt span{animation:rollout .26s var(--io) forwards}
#home.inn #path,#home.inn #pr,#home.inn #bkw{animation:swin .55s var(--out) backwards}
#home.inn #bt span{animation:rollin .55s var(--out) backwards}
#home.inn .chip.on{animation:pop .6s var(--spring)}
.banner::before{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 0,var(--y) 0 6px,transparent 7px);opacity:0;pointer-events:none}
#home.inn .banner::before{animation:orbit 1s var(--io)}
@keyframes rollout{to{transform:translateY(calc(var(--dir)*-110%));opacity:0}}
@keyframes rollin{from{transform:translateY(calc(var(--dir)*110%));opacity:0}}
@keyframes swout{to{transform:translateX(calc(var(--dir)*-36px));opacity:0}}
@keyframes swin{from{transform:translateX(calc(var(--dir)*36px));opacity:0}}
@keyframes orbit{from{opacity:1;transform:rotate(0)}to{opacity:1;transform:rotate(360deg)}}
.stampw{position:relative;width:196px;height:196px;margin:0 auto 18px;color:var(--g);transform:rotate(-12deg);animation:slam 1s var(--io) backwards}
.stampi{position:absolute;inset:0;border:5px solid currentColor;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:18px;text-align:center;opacity:.92}
.stampi::before{content:"";position:absolute;inset:8px;border:2px dashed currentColor;border-radius:50%}
.stampi b{font-size:19px;line-height:1.1;max-width:128px;font-weight:800}
.stampi .sf{font-size:30px;line-height:1}
.stampi .sc{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;border-top:2px solid currentColor;border-bottom:2px solid currentColor;padding:2px 0 2px .22em;margin-top:2px}
.stampi .sd{font-size:11px;font-weight:700;letter-spacing:.1em}
.stampw::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid currentColor;opacity:0;animation:splash .7s .42s var(--out)}
.end{animation:thud 1s var(--out)}
@keyframes slam{0%{transform:scale(2.8) rotate(-30deg);opacity:0}45%{transform:scale(.9) rotate(-12deg);opacity:1}58%{transform:scale(1.05) rotate(-12deg)}72%{transform:scale(.99) rotate(-14deg)}86%{transform:scale(1) rotate(-11deg)}100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes splash{from{transform:scale(.9);opacity:.5}to{transform:scale(1.6);opacity:0}}
@keyframes thud{0%,42%{transform:none}48%{transform:translateY(7px)}62%{transform:none}}
.stampw i{position:absolute;left:50%;top:50%;border-radius:50%;background:currentColor;opacity:0;animation:splat .65s .45s var(--out)}
.stampi .sc{animation:tight .6s .45s var(--out) backwards}
@keyframes splat{from{opacity:.85;transform:translate(-50%,-50%) rotate(var(--a)) translateX(92px)}to{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--r)) scale(.3)}}
@keyframes tight{from{letter-spacing:.8em;opacity:0}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 14px;text-align:left}
.sc2{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;animation:up .6s var(--out) .95s backwards}
.sc2:nth-child(2){animation-delay:1.05s}.sc2:nth-child(3){animation-delay:1.15s}.sc2:nth-child(4){animation-delay:1.25s}
.sc2 b{display:block;font-size:26px;font-weight:800;color:var(--g)}.sc2 span{color:var(--mute);font-weight:700;font-size:14px}
.sec{display:block;width:100%;background:var(--card);color:var(--g);border:1.5px solid var(--g);border-radius:99px;padding:13px;font-weight:800;font-size:16px;animation:up .6s var(--out) 1.4s backwards;transition:transform .3s var(--spring)}.sec:active{transform:scale(.97)}
.perf{color:var(--okd);font-weight:800;animation:up .6s var(--out) 1.4s backwards}
.wh{position:relative;z-index:1;display:flex;align-items:center;gap:14px;width:100%;background:var(--g);color:#fff;border-radius:22px;padding:14px 18px;box-shadow:0 12px 24px -12px color-mix(in srgb,var(--g) 70%,transparent)}
.wh.in{animation:up .6s var(--out) backwards;animation-delay:var(--d)}
.wh.lk{background:var(--lock);color:var(--mute);box-shadow:none}
.we{font-size:30px;line-height:1}.wh b{display:block;font-size:19px}.wh small{font-weight:600;opacity:.9}
.wp{margin-left:auto;font-weight:800;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px}
.wh.new{animation:pop .8s var(--spring) .5s backwards}
.wh.new::after{content:"New area!";position:absolute;top:-10px;right:14px;background:var(--y);color:#3a2c00;font-weight:800;font-size:12px;border-radius:99px;padding:2px 10px}
.ti{width:100%;padding:16px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:20px;font-weight:700}.ti:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mt>div{display:grid;gap:10px;align-content:start}
.ans{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;border-bottom:2px solid var(--line);margin-bottom:16px}.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--line);transition:transform .3s var(--spring)}.tile:active{transform:scale(.93)}
.pav{width:84px;height:84px;margin:8px auto 14px;border-radius:50%;background:var(--bl);border:3px solid var(--g);display:grid;place-items:center;font-size:44px;overflow:hidden}.pav img,.gear img{width:100%;height:100%;object-fit:cover}.gear{overflow:hidden}
.xpb{height:10px;background:var(--lock);border-radius:99px;overflow:hidden;flex:1}.xpb i{display:block;height:100%;background:var(--y);border-radius:99px}
.lp{display:flex;align-items:center;gap:10px;margin:8px 0}.lp span{min-width:112px;font-weight:700}.ac{font-size:14px;line-height:1.45}
#sheet{max-height:92vh;overflow:auto}#sheet .sc2{animation:none}
#wr{position:fixed;inset:0;z-index:25;background:var(--bg);background-image:var(--dots);background-size:26px 26px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:up .45s var(--out)}
#wb{flex:1;overflow:auto;max-width:520px;width:100%;margin:0 auto;padding:6px 16px 28px;text-align:center}
.wbox{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:0 auto}
.wsv{display:block;width:100%;height:100%;background:var(--card);border:1.5px solid var(--line);border-radius:24px}
.wbox .wsv{position:absolute;inset:0}.wbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;color:var(--ink);cursor:crosshair}.wbox.nh .sg,.wbox.nh .dt,.wbox.nh .nm{opacity:0}
.gl{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 2;fill:none}
